[package]
name = "nullmark"
version = "1.0.0-beta.2"
description = "Local text and file privacy sanitizer"
authors = ["VisionGaia Technology"]
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/VisionGaiaTechnology/nullmark"

[lib]
name = "nullmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
crc32fast = "=1.5.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "=0.41.0"
lopdf = { version = "=0.44.0", default-features = false }
